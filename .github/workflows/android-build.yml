          EOF

          cat > app/src/main/res/drawable/ic_forge.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">

              <path
                  android:fillColor="#4D91FF"
                  android:pathData="M24,2 L46,14.5 L46,33.5 L24,46 L2,33.5 L2,14.5 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M15,11 L33,11 L33,16 L20,16 L20,21 L31,21 L31,26 L20,26 L20,32 L34,32 L34,37 L15,37 Z" />

