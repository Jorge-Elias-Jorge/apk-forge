name: APK Forge - Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Forge
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/apkforge/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APKForge"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.apkforge.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.apkforge.app"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="APK Forge"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/apkforge/app/MainActivity.kt <<'EOF'
          package com.apkforge.app

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val blue = Color.rgb(35, 110, 235)
              private val dark = Color.rgb(18, 24, 38)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  showHome()
              }

              private fun showHome() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(28, 48, 28, 28)
                      setBackgroundColor(Color.rgb(245, 247, 250))
                  }

                  val title = TextView(this).apply {
                      text = "APK Forge"
                      textSize = 30f
                      setTextColor(dark)
                      gravity = Gravity.CENTER
                  }

                  val subtitle = TextView(this).apply {
                      text = "Cria aplicações Android a partir de projetos web."
                      textSize = 16f
                      setTextColor(Color.DKGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 16, 0, 32)
                  }

                  val newProject = Button(this).apply {
                      text = "Novo projeto"
                      setBackgroundColor(blue)
                      setTextColor(Color.WHITE)
                      setOnClickListener { showNewProject() }
                  }

                  root.addView(title, match())
                  root.addView(subtitle, match())
                  root.addView(newProject, match())

                  setContentView(root)
              }

              private fun showNewProject() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 32, 24, 24)
                      setBackgroundColor(Color.rgb(245, 247, 250))
                  }

                  val title = TextView(this).apply {
                      text = "Novo projeto"
                      textSize = 26f
                      setTextColor(dark)
                  }

                  val info = TextView(this).apply {
                      text = "A importação de sites, HTML e ZIP será adicionada nas próximas etapas."
                      textSize = 16f
                      setTextColor(Color.DKGRAY)
                      setPadding(0, 20, 0, 20)
                  }

                  val back = Button(this).apply {
                      text = "Voltar"
                      setOnClickListener { showHome() }
                  }

                  root.addView(title, match())
                  root.addView(info, match())
                  root.addView(back, match())
                  setContentView(root)
              }

              private fun match(): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
              }
          }
          EOF

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: APK-Forge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
