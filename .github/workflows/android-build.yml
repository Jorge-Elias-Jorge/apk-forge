
name: APK Forge - Preparar compilador Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-compilador:
    name: Preparar ferramentas Android
    runs-on: ubuntu-latest

    steps:
      - name: Obter os ficheiros do projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar Java
        run: java -version

      - name: Verificar Android SDK
        run: sdkmanager --version

      - name: Verificar Gradle
        run: gradle --version

      - name: Confirmar ferramentas
        run: |
          echo "APK Forge: ferramentas verificadas."
          echo "Java, Android SDK e Gradle estao disponiveis."
