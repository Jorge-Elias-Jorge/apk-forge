<script>
"use strict";

/*
 * APK FORGE - INTERFACE LOCAL
 *
 * Esta versão guarda metadados no armazenamento local.
 * Não envia projetos para servidores nem compila APKs.
 */

const STORAGE_PROJECTS = "apkforge_projects_v2";
const STORAGE_BUILDS = "apkforge_builds_v2";
const STORAGE_SETTINGS = "apkforge_settings_v2";

let currentSource = "";
let editingId = null;
let selectedIconData = "";
let selectedZipName = "";
let selectedZipSize = 0;

function readStorage(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (e) {
    return fallback;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    showToast("Não foi possível guardar. O armazenamento pode estar cheio.");
    return false;
  }
}

function getProjects() {
  return readStorage(STORAGE_PROJECTS, []);
}

function getBuilds() {
  return readStorage(STORAGE_BUILDS, []);
}

function getSettings() {
  return readStorage(STORAGE_SETTINGS, {
    orientation: "portrait"
  });
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 3500);
}

function showPage(name) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  const page = document.getElementById("page-" + name);
  if (page) {
    page.classList.add("active");
  }

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === name);
  });

  if (name === "home") renderHome();
  if (name === "projects") renderProjects();
  if (name === "builds") renderBuilds();
  if (name === "settings") loadSettings();

  window.scrollTo(0, 0);
}

function chooseSource(source) {
  currentSource = source;
  editingId = null;
  selectedIconData = "";
  selectedZipName = "";
  selectedZipSize = 0;

  document.getElementById("project-form").reset();
  document.getElementById("icon-preview").innerHTML = "＋";

  document.getElementById("url-field").classList.toggle("hidden", source !== "url");
  document.getElementById("zip-field").classList.toggle("hidden", source !== "zip");
  document.getElementById("html-field").classList.toggle("hidden", source !== "html");

  const titles = {
    url: "Aplicação a partir de site",
    zip: "Aplicação a partir de ZIP",
    html: "Aplicação a partir de HTML"
  };

  const subtitles = {
    url: "Introduz o endereço e configura a aplicação.",
    zip: "Seleciona um projeto web e configura a aplicação.",
    html: "Cola o teu código e configura a aplicação."
  };

  document.getElementById("editor-title").textContent = titles[source];
  document.getElementById("editor-subtitle").textContent = subtitles[source];

  document.getElementById("app-orientation").value =
    getSettings().orientation || "portrait";

  showPage("editor");
}

document.getElementById("app-icon").addEventListener("change", function() {
  const file = this.files && this.files[0];
  if (!file) {
    selectedIconData = "";
    document.getElementById("icon-preview").innerHTML = "＋";
    return;
  }

  if (!file.type.startsWith("image/")) {
    showToast("Seleciona um ficheiro de imagem.");
    this.value = "";
    return;
  }

  if (file.size > 2 * 1024 * 1024) {
    showToast("A imagem deve ter no máximo 2 MB.");
    this.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    selectedIconData = event.target.result;
    document.getElementById("icon-preview").innerHTML =
      '<img alt="Pré-visualização do logótipo" src="' +
      selectedIconData + '">';
  };

  reader.onerror = function() {
    showToast("Não foi possível ler a imagem.");
  };

  reader.readAsDataURL(file);
});

document.getElementById("zip-file").addEventListener("change", function() {
  const file = this.files && this.files[0];

  if (!file) {
    selectedZipName = "";
    selectedZipSize = 0;
    document.getElementById("zip-info").textContent =
      "Seleciona o ficheiro ZIP através do gestor de ficheiros do telemóvel.";
    return;
  }

  if (!file.name.toLowerCase().endsWith(".zip")) {
    showToast("Seleciona um ficheiro .zip.");
    this.value = "";
    return;
  }

  selectedZipName = file.name;
  selectedZipSize = file.size;

  document.getElementById("zip-info").textContent =
    "Selecionado: " + file.name +
    " (" + formatBytes(file.size) + ").";
});

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function saveProject(event) {
  event.preventDefault();

  const name = document.getElementById("app-name").value.trim();
  const orientation = document.getElementById("app-orientation").value;

  if (!name) {
    showToast("Introduz o nome da aplicação.");
    return;
  }

  const project = {
    id: editingId || (
      "project_" + Date.now() + "_" +
      Math.random().toString(36).slice(2, 8)
    ),
    name: name,
    source: currentSource,
    orientation: orientation,
    icon: selectedIconData,
    createdAt: new Date().toISOString(),
    sourceInfo: {}
  };

  if (currentSource === "url") {
    const url = document.getElementById("app-url").value.trim();

    if (!url) {
      showToast("Introduz o endereço do site.");
      return;
    }

    try {
      const parsed = new URL(url);
      if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
        showToast("O endereço deve começar com http:// ou https://.");
        return;
      }
    } catch (e) {
      showToast("O endereço introduzido não é válido.");
      return;
    }

    project.sourceInfo.url = url;
  }

  if (currentSource === "zip") {
    const fileInput = document.getElementById("zip-file");
    const file = fileInput.files && fileInput.files[0];

    if (!file) {
      showToast("Seleciona o ficheiro ZIP.");
      return;
    }

    /*
     * Apenas os metadados são guardados.
     * O conteúdo binário do ZIP não é persistido.
     */
    project.sourceInfo.fileName = file.name;
    project.sourceInfo.fileSize = file.size;
    project.sourceInfo.fileNeedsReselection = true;
  }

  if (currentSource === "html") {
    const html = document.getElementById("html-code").value.trim();

    if (!html) {
      showToast("Cola o código HTML.");
      return;
    }

    if (!/<html[\s>]/i.test(html) && !/<!doctype/i.test(html)) {
      showToast("Confirma que introduziste o código HTML completo.");
      return;
    }

    project.sourceInfo.html = html;
  }

  const projects = getProjects();
  const existingIndex = projects.findIndex(p => p.id === project.id);

  if (existingIndex >= 0) {
    projects[existingIndex] = project;
  } else {
    projects.unshift(project);
  }

  if (!writeStorage(STORAGE_PROJECTS, projects)) {
    return;
  }

  showToast("Projeto guardado neste dispositivo.");
  showPage("projects");
}
EOF

function sourceLabel(source) {
  const labels = {
    url: "Site",
    zip: "Ficheiro ZIP",
    html: "Código HTML"
  };

  return labels[source] || "Projeto";
}

function orientationLabel(orientation) {
  const labels = {
    portrait: "Vertical",
    landscape: "Horizontal",
    unspecified: "Automática"
  };

  return labels[orientation] || "Automática";
}

function projectIcon(project) {
  if (project.icon) {
    return '<img alt="" src="' + project.icon + '">';
  }

  const icons = {
    url: "🌐",
    zip: "📦",
    html: "⌨️"
  };

  return icons[project.source] || "📱";
}

function renderProjectCard(project, showDelete) {
  const card = document.createElement("div");
  card.className = "card";

  const row = document.createElement("div");
  row.className = "project";

  const icon = document.createElement("div");
  icon.className = "project-icon";
  icon.innerHTML = projectIcon(project);

  const info = document.createElement("div");
  info.className = "project-info";

  const title = document.createElement("strong");
  title.textContent = project.name;

  const description = document.createElement("p");
  description.textContent =
    sourceLabel(project.source) + " · " +
    orientationLabel(project.orientation);

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = "Guardado localmente";

  info.appendChild(title);
  info.appendChild(description);
  info.appendChild(tag);

  row.appendChild(icon);
  row.appendChild(info);
  card.appendChild(row);

  if (project.source === "url" && project.sourceInfo.url) {
    const link = document.createElement("p");
    link.className = "hint";
    link.textContent = project.sourceInfo.url;
    card.appendChild(link);
  }

  if (project.source === "zip" && project.sourceInfo.fileName) {
    const zip = document.createElement("p");
    zip.className = "hint";
    zip.textContent =
      project.sourceInfo.fileName +
      " · " + formatBytes(project.sourceInfo.fileSize || 0);
    card.appendChild(zip);

    const warning = document.createElement("p");
    warning.className = "hint";
    warning.textContent =
      "O ficheiro original terá de ser selecionado novamente para ser enviado para compilação.";
    card.appendChild(warning);
  }

  if (project.source === "html") {
    const htmlInfo = document.createElement("p");
    htmlInfo.className = "hint";
    htmlInfo.textContent =
      (project.sourceInfo.html || "").length +
      " caracteres HTML guardados.";
    card.appendChild(htmlInfo);
  }

  const actions = document.createElement("div");
  actions.className = "form-actions";

  const buildButton = document.createElement("button");
  buildButton.className = "secondary";
  buildButton.type = "button";
  buildButton.textContent = "Compilar APK";
  buildButton.onclick = function() {
    showPage("builds");
    showToast("A compilação ainda não está ligada ao GitHub Actions.");
  };

  actions.appendChild(buildButton);

  if (showDelete) {
    const deleteButton = document.createElement("button");
    deleteButton.className = "danger";
    deleteButton.type = "button";
    deleteButton.textContent = "Apagar";
    deleteButton.onclick = function() {
      deleteProject(project.id);
    };
    actions.appendChild(deleteButton);
  }

  card.appendChild(actions);
  return card;
}

function renderHome() {
  const projects = getProjects();
  const builds = getBuilds();

  document.getElementById("stat-projects").textContent = projects.length;
  document.getElementById("stat-builds").textContent = builds.length;

  const container = document.getElementById("home-projects");
  container.innerHTML = "";

  if (!projects.length) {
    container.innerHTML =
      '<div class="empty">' +
      '<div class="empty-icon">📱</div>' +
      '<strong>Ainda não tens projetos.</strong><br>' +
      'Cria o teu primeiro projeto para começar.' +
      '</div>';
    return;
  }

  projects.slice(0, 3).forEach(project => {
    container.appendChild(renderProjectCard(project, false));
  });
}

function renderProjects() {
  const projects = getProjects();
  const container = document.getElementById("all-projects");
  container.innerHTML = "";

  if (!projects.length) {
    container.innerHTML =
      '<div class="empty">' +
      '<div class="empty-icon">📂</div>' +
      '<strong>Nenhum projeto guardado.</strong><br>' +
      'Os teus projetos aparecerão aqui.' +
      '</div>';
    return;
  }

  projects.forEach(project => {
    container.appendChild(renderProjectCard(project, true));
  });
}

function deleteProject(id) {
  if (!confirm("Queres apagar este projeto guardado?")) {
    return;
  }

  const projects = getProjects().filter(p => p.id !== id);
  writeStorage(STORAGE_PROJECTS, projects);
  renderProjects();
  renderHome();
  showToast("Projeto apagado.");
}

function renderBuilds() {
  const builds = getBuilds();
  const container = document.getElementById("all-builds");
  container.innerHTML = "";

  if (!builds.length) {
    container.innerHTML =
      '<div class="empty">' +
      '<div class="empty-icon">⚒</div>' +
      '<strong>Sem compilações registadas.</strong><br>' +
      'Quando a integração com o serviço de construção estiver disponível, os estados reais aparecerão aqui.' +
      '</div>';
    return;
  }

  builds.forEach(build => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("strong");
    title.textContent = build.projectName || "Projeto";

    const detail = document.createElement("p");
    detail.className = "hint";
    detail.textContent = build.status || "Estado desconhecido";

    card.appendChild(title);
    card.appendChild(detail);

    if (build.url) {
      const link = document.createElement("a");
      link.href = build.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Abrir compilação";
      link.style.color = "#83a7ff";
      card.appendChild(link);
    }

    container.appendChild(card);
  });
}

function loadSettings() {
  const settings = getSettings();
  document.getElementById("default-orientation").value =
    settings.orientation || "portrait";
}

function saveSettings() {
  const settings = {
    orientation: document.getElementById("default-orientation").value
  };

  if (writeStorage(STORAGE_SETTINGS, settings)) {
    showToast("Preferências guardadas.");
  }
}

function clearAllProjects() {
  if (!confirm("Apagar todos os projetos guardados neste dispositivo?")) {
    return;
  }

  localStorage.removeItem(STORAGE_PROJECTS);
  renderHome();
  renderProjects();
  showToast("Projetos apagados.");
}

/* Inicialização */
loadSettings();
renderHome();
renderProjects();
renderBuilds();
</script>

</div>
</body>
</html>
