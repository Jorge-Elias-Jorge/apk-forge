    padding: 30px 24px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">F</div>
    <div>
      <h1>APK Forge</h1>
      <p>O teu estúdio de aplicações</p>
    </div>
  </div>
  <button class="icon-btn" onclick="showPage('settings')" aria-label="Configurações">⚙</button>
</header>

<main>

<section class="page active" id="page-home">
  <div class="hero">
    <div class="hero-icon">⚡</div>
    <div class="eyebrow">APK Forge Studio</div>
    <h2>Cria a tua própria aplicação.</h2>
    <p>Transforma um site, um projeto HTML ou um ficheiro ZIP numa aplicação Android.</p>
    <button class="primary" onclick="showPage('create')">＋ Criar projeto</button>
  </div>

  <div class="stats">
    <div class="stat">
      <strong id="stat-projects">0</strong>
      <span>Projetos guardados</span>
    </div>
    <div class="stat">
      <strong id="stat-builds">0</strong>
      <span>Registos de compilação</span>
    </div>
  </div>

  <div class="section-head">
    <h3>Projetos recentes</h3>
    <button class="small-link" onclick="showPage('projects')">Ver todos →</button>
  </div>

  <div id="home-projects"></div>
</section>
EOF

<!-- CRIAR -->
<section class="page" id="page-create">
  <div class="eyebrow">Novo projeto</div>
  <h2>Como queres começar?</h2>
  <p class="subtitle">Escolhe a origem do conteúdo da tua aplicação.</p>

  <button class="choice" onclick="chooseSource('url')">
    <div class="choice-icon">🌐</div>
    <div class="choice-content">
      <strong>A partir de um site</strong>
      <span>Introduz o endereço de um site para abrir dentro da aplicação.</span>
    </div>
    <span class="arrow">›</span>
  </button>

  <button class="choice" onclick="chooseSource('zip')">
    <div class="choice-icon">📦</div>
    <div class="choice-content">
      <strong>A partir de um ZIP</strong>
      <span>Seleciona um projeto com ficheiros HTML, CSS, JavaScript e imagens.</span>
    </div>
    <span class="arrow">›</span>
  </button>

  <button class="choice" onclick="chooseSource('html')">
    <div class="choice-icon">⌨️</div>
    <div class="choice-content">
      <strong>A partir de código HTML</strong>
      <span>Cola o código HTML da aplicação diretamente no editor.</span>
    </div>
    <span class="arrow">›</span>
  </button>

  <div class="form-actions">
    <button class="secondary" onclick="showPage('home')">Voltar</button>
  </div>
</section>

<!-- FORMULÁRIO -->
<section class="page" id="page-editor">
  <div class="eyebrow">Configurar aplicação</div>
  <h2 id="editor-title">Novo projeto</h2>
  <p class="subtitle" id="editor-subtitle">Define os detalhes da tua aplicação.</p>

  <form id="project-form" onsubmit="saveProject(event)">

    <label for="app-name">Nome da aplicação *</label>
    <input id="app-name" maxlength="50" placeholder="Ex.: Minha Aplicação" required>

    <div id="url-field" class="hidden">
      <label for="app-url">Endereço do site *</label>
      <input id="app-url" type="url" placeholder="https://exemplo.com">
      <p class="hint">Introduz o endereço completo, incluindo https://. O site precisa de permitir a abertura dentro de uma WebView.</p>
    </div>

    <div id="zip-field" class="hidden">
      <label for="zip-file">Ficheiro ZIP do projeto *</label>
      <input id="zip-file" type="file" accept=".zip,application/zip">
      <p class="hint" id="zip-info">Seleciona o ficheiro ZIP através do gestor de ficheiros do telemóvel.</p>
    </div>

    <div id="html-field" class="hidden">
      <label for="html-code">Código HTML *</label>
      <textarea id="html-code" placeholder="<!DOCTYPE html>&#10;<html>&#10;  <head>&#10;    <title>Minha aplicação</title>&#10;  </head>&#10;  <body>&#10;    <h1>Olá!</h1>&#10;  </body>&#10;</html>"></textarea>
      <p class="hint">Podes colar HTML com CSS e JavaScript incorporados. Recursos externos podem precisar de Internet.</p>
    </div>

    <label for="app-orientation">Orientação do ecrã</label>
    <select id="app-orientation">
      <option value="portrait">Vertical (retrato)</option>
      <option value="landscape">Horizontal (paisagem)</option>
      <option value="unspecified">Automática</option>
    </select>

    <label for="app-icon">Logótipo da aplicação (opcional)</label>
    <input id="app-icon" type="file" accept="image/png,image/jpeg,image/webp">
    <div class="preview" id="icon-preview">＋</div>
    <p class="hint">Escolhe uma imagem PNG, JPG ou WebP. A imagem será guardada localmente no projeto, se o armazenamento estiver disponível.</p>

    <div class="notice">
      Os dados do formulário são guardados neste dispositivo. A criação de um registo de projeto não significa que o APK já tenha sido compilado.
    </div>

    <div class="form-actions">
      <button type="button" class="secondary" onclick="showPage('create')">Voltar</button>
      <button type="submit" class="primary">Guardar projeto</button>
    </div>
  </form>
</section>

<!-- PROJETOS -->
<section class="page" id="page-projects">
  <div class="eyebrow">Biblioteca</div>
  <h2>Meus projetos</h2>
  <p class="subtitle">Os projetos guardados neste dispositivo aparecem aqui.</p>

  <div id="all-projects"></div>

  <button class="primary" onclick="showPage('create')">＋ Criar projeto</button>
</section>

<!-- COMPILAÇÕES -->
<section class="page" id="page-builds">
  <div class="eyebrow">Estado de construção</div>
  <h2>Compilações</h2>
  <p class="subtitle">Consulta os registos de compilação dos teus projetos.</p>

  <div class="notice">
    <strong>Compilação real</strong><br>
    A compilação de um APK personalizado requer que o projeto seja enviado para um serviço de construção, como o GitHub Actions. Esta interface ainda não está ligada a esse serviço.
    Nenhuma percentagem será apresentada como progresso real sem receber o estado da compilação.
  </div>

  <div id="all-builds"></div>
</section>

<!-- CONFIGURAÇÕES -->
<section class="page" id="page-settings">
  <div class="eyebrow">Preferências</div>
  <h2>Configurações</h2>
  <p class="subtitle">Personaliza as preferências locais do APK Forge.</p>

  <div class="card">
    <div class="setting-row">
      <div>
        <strong>Orientação predefinida</strong>
        <span>Usada nos novos projetos.</span>
      </div>
      <select id="default-orientation" onchange="saveSettings()">
        <option value="portrait">Vertical</option>
        <option value="landscape">Horizontal</option>
        <option value="unspecified">Automática</option>
      </select>
    </div>

    <div class="setting-row">
      <div>
        <strong>Guardar projetos localmente</strong>
        <span>Os registos ficam no armazenamento do navegador.</span>
      </div>
      <span class="tag">Ativo</span>
    </div>
  </div>

  <div class="section-head">
    <h3>Armazenamento</h3>
  </div>

  <div class="card">
    <p class="hint">Os dados são guardados no armazenamento local da aplicação. Limpar os dados da aplicação ou do navegador pode apagar os projetos. Mantém cópias dos teus ficheiros originais.</p>
    <button class="danger" onclick="clearAllProjects()">Apagar todos os projetos</button>
  </div>

  <div class="section-head">
    <h3>Sobre</h3>
  </div>
  <div class="card">
    <strong>APK Forge</strong>
    <p class="hint">Estúdio de criação de aplicações Android.</p>
    <span class="tag">Interface v2.0</span>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="home" onclick="showPage('home')">
    <span class="nav-icon">⌂</span>
    Início
  </button>
  <button class="nav-btn" data-page="projects" onclick="showPage('projects')">
    <span class="nav-icon">▣</span>
    Projetos
  </button>
  <button class="nav-btn" data-page="create" onclick="showPage('create')">
    <span class="nav-icon">＋</span>
    Criar
  </button>
  <button class="nav-btn" data-page="builds" onclick="showPage('builds')">
    <span class="nav-icon">⚒</span>
    Builds
  </button>
</nav>

<div class="toast" id="toast"></div>
