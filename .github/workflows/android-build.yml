          cat > app/src/main/java/com/jorge/apkforge/MainActivity.kt <<'EOF'
          package com.jorge.apkforge

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.EditText
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var statusText: TextView
              private lateinit var detailText: TextView

              companion object {
                  private const val PICK_HTML = 101
                  private const val PICK_ZIP = 102
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  statusText = findViewById(R.id.statusText)
                  detailText = findViewById(R.id.detailText)

                  findViewById<View>(R.id.websiteCard).setOnClickListener {
                      showWebsiteDialog()
                  }

                  findViewById<View>(R.id.htmlCard).setOnClickListener {
                      showHtmlOptions()
                  }

                  findViewById<View>(R.id.zipCard).setOnClickListener {
                      selectFile(PICK_ZIP)
                  }

                  findViewById<View>(R.id.settingsButton).setOnClickListener {
                      showSettings()
                  }

                  findViewById<View>(R.id.projectsButton).setOnClickListener {
                      showProjects()
                  }
              }

              private fun selectFile(requestCode: Int) {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT)

                  intent.addCategory(Intent.CATEGORY_OPENABLE)

                  intent.type = when (requestCode) {
                      PICK_HTML -> "text/html"
                      else -> "application/zip"
                  }

                  try {
                      startActivityForResult(intent, requestCode)
                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "Não foi possível abrir o seletor de ficheiros.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              @Deprecated("Compatibilidade com Android")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (resultCode != RESULT_OK || data?.data == null) {
                      return
                  }

                  val uri = data.data!!

                  try {
                      contentResolver.takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                      )
                  } catch (_: Exception) {
                  }

                  when (requestCode) {

                      PICK_HTML -> {
                          statusText.text = "Ficheiro HTML selecionado"

                          detailText.text =
                              uri.lastPathSegment ?: "HTML selecionado"
                      }

                      PICK_ZIP -> {
                          statusText.text = "Projeto ZIP selecionado"

                          detailText.text =
                              uri.lastPathSegment ?: "ZIP selecionado"
                      }
                  }

                  Toast.makeText(
                      this,
                      "Ficheiro selecionado.",
                      Toast.LENGTH_SHORT
                  ).show()
              }

              private fun showWebsiteDialog() {
                  val input = EditText(this)

                  input.hint = "https://exemplo.com"

                  input.inputType =
                      InputType.TYPE_CLASS_TEXT or
                      InputType.TYPE_TEXT_VARIATION_URI
                  input.setSingleLine(true)

                  AlertDialog.Builder(this)
                      .setTitle("Adicionar website")
                      .setMessage(
                          "Introduz o endereço do website."
                      )
                      .setView(input)
                      .setNegativeButton(
                          "Cancelar",
                          null
                      )
                      .setPositiveButton(
                          "Continuar"
                      ) { _, _ ->

                          var url =
                              input.text.toString().trim()

                          if (url.isEmpty()) {

                              Toast.makeText(
                                  this,
                                  "Introduz um endereço.",
                                  Toast.LENGTH_SHORT
                              ).show()

                              return@setPositiveButton
                          }

                          if (
                              !url.startsWith("https://") &&
                              !url.startsWith("http://")
                          ) {
                              url = "https://$url"
                          }

                          statusText.text =
                              "Website selecionado"

                          detailText.text = url

                          Toast.makeText(
                              this,
                              "Endereço guardado.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      .show()
              }

              private fun showHtmlOptions() {
                  AlertDialog.Builder(this)
                      .setTitle("Importar HTML")
                      .setItems(
                          arrayOf(
                              "Selecionar ficheiro HTML",
                              "Colar código HTML"
                          )
                      ) { _, which ->

                          if (which == 0) {
                              selectFile(PICK_HTML)
                          } else {
                              showHtmlEditor()
                          }
                      }
                      .setNegativeButton(
                          "Cancelar",
                          null
                      )
                      .show()
              }

              private fun showHtmlEditor() {
                  val input = EditText(this)

                  input.hint =
                      "Cola aqui o código HTML"

                  input.minLines = 8

                  input.gravity = Gravity.TOP

                  input.inputType =
                      InputType.TYPE_CLASS_TEXT or
                      InputType.TYPE_TEXT_FLAG_MULTI_LINE

                  val scroll = ScrollView(this)

                  scroll.addView(input)

                  AlertDialog.Builder(this)
                      .setTitle("Colar código HTML")
                      .setView(scroll)
                      .setNegativeButton(
                          "Cancelar",
                          null
                      )
                      .setPositiveButton(
                          "Guardar"
                      ) { _, _ ->

                          val html =
                              input.text.toString()

                          if (html.isNotBlank()) {

                              statusText.text =
                                  "Código HTML introduzido"

                              detailText.text =
                                  "${html.length} caracteres de código"

                              Toast.makeText(
                                  this,
                                  "Código recebido.",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                      .show()
              }

              private fun showSettings() {
                  AlertDialog.Builder(this)
                      .setTitle("Definições")
                      .setMessage(
                          "APK Forge\n\n" +
                          "Versão 1.0.0\n" +
                          "Interface Android nativa\n" +
                          "Kotlin + XML"
                      )
                      .setPositiveButton(
                          "Fechar",
                          null
                      )
                      .show()
              }

              private fun showProjects() {
                  AlertDialog.Builder(this)
                      .setTitle("Os meus projetos")
                      .setMessage(
                          "Ainda não existem projetos guardados. " +
                          "A gestão persistente será adicionada numa próxima etapa."
                      )
                      .setPositiveButton(
                          "OK",
                          null
                      )
                      .show()
              }
          }
          EOF

      - name: Verificar projeto
        shell: bash
        run: |
          echo "Verificando estrutura do projeto..."
          find app/src/main -maxdepth 3 -type f | sort
          echo "Gradle:"
          gradle --version

      - name: Compilar APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          echo "APK produzido:"
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: APK-Forge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error