
name: APK Forge - Compilação Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Preparar repositório
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/jorge/apkforge
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APKForge"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jorge.apkforge'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jorge.apkforge'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="APK Forge"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jorge/apkforge/MainActivity.java <<'EOF'
          package com.jorge.apkforge;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  webView.setBackgroundColor(Color.WHITE);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  super.onBackPressed();
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#080b12">
            <title>APK Forge</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                padding: 20px;
                background: #080b12;
                color: #f4f7ff;
                font-family: Arial, sans-serif;
              }
              .header { text-align: center; margin: 30px 0; }
              .logo { font-size: 36px; }
              h1 { color: #4d91ff; margin-bottom: 8px; }
              p { color: #aab5ca; line-height: 1.5; }
              .card {
                background: #121927;
                border: 1px solid #27334a;
                border-radius: 16px;
                padding: 18px;
                margin: 16px 0;
              }
              label {
                display: block;
                margin: 12px 0 8px;
                font-weight: bold;
              }
              input, textarea, select {
                width: 100%;
                padding: 13px;
                border: 1px solid #34415b;
                border-radius: 10px;
                background: #080e19;
                color: white;
                font-size: 15px;
              }
              textarea { min-height: 120px; resize: vertical; }
              button {
                width: 100%;
                padding: 15px;
                margin-top: 14px;
                border: 0;
                border-radius: 10px;
                background: #2878f0;
                color: white;
                font-size: 16px;
                font-weight: bold;
              }
              .status {
                padding: 12px;
                border-radius: 10px;
                background: #102c20;
                color: #75e4a4;
                text-align: center;
              }
              .note { font-size: 13px; }
            </style>
          </head>
          <body>
            <div class="header">
              <div class="logo">⚒️</div>
              <h1>APK Forge</h1>
              <p>Transforma os teus projetos web em aplicações Android.</p>
            </div>

            <div class="card">
              <div class="status">APK Forge iniciado com sucesso</div>
              <label for="appname">Nome da aplicação</label>
              <input id="appname" placeholder="A minha aplicação">

              <label for="source">Tipo de projeto</label>
              <select id="source">
                <option value="url">Website / URL</option>
                <option value="html">Código HTML</option>
                <option value="zip">Projeto ZIP</option>
              </select>

              <div id="urlbox">
                <label for="url">Endereço do website</label>
                <input id="url" type="url" placeholder="https://exemplo.com">
              </div>

              <div id="htmlbox" style="display:none">
                <label for="htmlcode">Código HTML</label>
                <textarea id="htmlcode" placeholder="Cola aqui o teu código HTML"></textarea>
              </div>

              <div id="zipbox" style="display:none">
                <p>O suporte à importação de ZIP será integrado numa etapa posterior.</p>
              </div>

              <label for="orientation">Orientação do ecrã</label>
              <select id="orientation">
                <option value="portrait">Vertical</option>
                <option value="landscape">Horizontal</option>
                <option value="unspecified">Automática</option>
              </select>

              <button onclick="preview()">Testar projeto</button>
              <p class="note">
                Esta versão inicial permite testar a interface.
                A compilação de projetos importados será ligada ao
                sistema GitHub numa etapa posterior.
              </p>
            </div>

            <div class="card">
              <h3>Pré-visualização</h3>
              <iframe id="preview"
                style="width:100%;height:350px;background:white;border:0;border-radius:10px">
              </iframe>
            </div>

            <script>
              const source = document.getElementById('source');

              source.addEventListener('change', function() {
                document.getElementById('urlbox').style.display =
                  this.value === 'url' ? 'block' : 'none';
                document.getElementById('htmlbox').style.display =
                  this.value === 'html' ? 'block' : 'none';
                document.getElementById('zipbox').style.display =
                  this.value === 'zip' ? 'block' : 'none';
              });

              function preview() {
                const type = source.value;
                const frame = document.getElementById('preview');

                if (type === 'url') {
                  let url = document.getElementById('url').value.trim();
                  if (!url) {
                    alert('Introduz o endereço do website.');
                    return;
                  }
                  if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                  }
                  frame.src = url;
                } else if (type === 'html') {
                  const html = document.getElementById('htmlcode').value;
                  if (!html.trim()) {
                    alert('Cola primeiro o código HTML.');
                    return;
                  }
                  frame.srcdoc = html;
                } else {
                  alert('A importação ZIP será integrada numa próxima versão.');
                }
              }
            </script>
          </body>
          </html>
          EOF

      - name: Instalar componentes Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: APK-Forge
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
