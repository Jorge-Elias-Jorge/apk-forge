
name: APK Forge - Kotlin Native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Forge
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
  run: |
    echo

- name: Aceitar licenças Android
  run: yes | sdkmanager --licenses > /dev/null || true

- name: Instalar componentes Android
  run: |
    sdkmanager "platform-tools"
    sdkmanager "platforms;android-35"
    sdkmanager "build-tools;35.0.0"
     
 - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar componentes Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Criar projeto Kotlin e XML
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/jorge/apkforge
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "APKForge"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.jorge.apkforge'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jorge.apkforge'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="APK Forge"
                  android:icon="@drawable/ic_forge"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="background">#080B12</color>
              <color name="surface">#121927</color>
              <color name="surface_alt">#1A2435</color>
              <color name="primary">#4D91FF</color>
              <color name="primary_dark">#2468D9</color>
              <color name="text_primary">#F4F7FF</color>
              <color name="text_secondary">#AAB5CA</color>
              <color name="border">#29364C</color>
              <color name="success">#55D995</color>
          </resources>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
