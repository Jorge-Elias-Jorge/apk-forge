          cat > app/src/main/java/com/jorge/apkforge/MainActivity.kt <<'EOF'
          package com.jorge.apkforge

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.net.Uri
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import android.view.View
          import android.view.Gravity
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.Button
          import android.widget.ScrollView
          import android.widget.ImageView
          import android.widget.ImageButton
          import android.app.AlertDialog
          import android.text.InputType
          import android.content.ActivityNotFoundException

          class MainActivity : Activity() {

              private lateinit var statusText: TextView
              private lateinit var detailText: TextView

              private val pickHtml =
                  registerForActivityResult(
                      androidXActivityResultContract()
                  ) { uri: Uri? ->
                      if (uri != null) {
                          contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                          statusText.text = "Ficheiro selecionado"
                          detailText.text = uri.lastPathSegment ?: "HTML selecionado"
                          Toast.makeText(
                              this,
                              "Ficheiro selecionado com sucesso.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }

              private val pickZip =
                  registerForActivityResult(
                      androidXActivityResultContract()
                  ) { uri: Uri? ->
                      if (uri != null) {
                          statusText.text = "Projeto ZIP selecionado"
                          detailText.text = uri.lastPathSegment ?: "ZIP selecionado"
                          Toast.makeText(
                              this,
                              "ZIP selecionado. A integração de compilação será adicionada na próxima etapa.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }

              private fun androidXActivityResultContract():
                  androidx.activity.result.contract.ActivityResultContracts.GetContent {
                  return androidx.activity.result.contract.ActivityResultContracts.GetContent()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  statusText = findViewById(R.id.statusText)
                  detailText = findViewById(R.id.detailText)

                  findViewById<View>(R.id.websiteCard).setOnClickListener {
                      showWebsiteDialog()
                  }

                  findViewById<View>(R.id.htmlCard).setOnClickListener {
                      showHtmlOptions()
                  }

                  findViewById<View>(R.id.zipCard).setOnClickListener {
                      pickZip.launch("application/zip")
                  }

                  findViewById<View>(R.id.settingsButton).setOnClickListener {
                      showSettings()
                  }

                  findViewById<View>(R.id.projectsButton).setOnClickListener {
                      showProjects()
                  }
              }

              private fun showWebsiteDialog() {
                  val input = EditText(this)
                  input.hint = "https://exemplo.com"
                  input.inputType = InputType.TYPE_TEXT_VARIATION_URI
                  input.setSingleLine(true)

                  AlertDialog.Builder(this)
                      .setTitle("Adicionar website")
                      .setMessage("Introduz o endereço do website.")
                      .setView(input)
                      .setNegativeButton("Cancelar", null)
                      .setPositiveButton("Continuar") { _, _ ->
                          var url = input.text.toString().trim()

                          if (url.isEmpty()) {
                              Toast.makeText(
                                  this,
                                  "Introduz um endereço.",
                                  Toast.LENGTH_SHORT
                              ).show()
                              return@setPositiveButton
                          }

                          if (!url.startsWith("https://") &&
                              !url.startsWith("http://")) {
                              url = "https://$url"
                          }

                          statusText.text = "Website selecionado"
                          detailText.text = url

                          Toast.makeText(
                              this,
                              "Endereço guardado. A integração de compilação será adicionada na próxima etapa.",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                      .show()
              }

              private fun showHtmlOptions() {
                  AlertDialog.Builder(this)
                      .setTitle("Importar HTML")
                      .setItems(
                          arrayOf("Selecionar ficheiro HTML", "Colar código HTML")
                      ) { _, which ->
                          if (which == 0) {
                              pickHtml.launch("text/html")
                          } else {
                              showHtmlEditor()
                          }
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun